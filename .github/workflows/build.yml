name: Build All 3 Gig Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Customer App APK
      run: |
        cd apps/customer_app
        flutter create . --platforms=android
        flutter pub get
        flutter build apk --release

    - name: Build Partner App APK
      run: |
        cd apps/partner_app
        flutter create . --platforms=android
        flutter pub get
        flutter build apk --release

    - name: Build Admin App APK
      run: |
        cd apps/admin_app
        flutter create . --platforms=android
        flutter pub get
        flutter build apk --release

    - name: Upload All APKs
      uses: actions/upload-artifact@v4
      with:
        name: all-gig-apps
        path: |
          apps/customer_app/build/app/outputs/flutter-apk/app-release.apk
          apps/partner_app/build/app/outputs/flutter-apk/app-release.apk
          apps/admin_app/build/app/outputs/flutter-apk/app-release.apk
