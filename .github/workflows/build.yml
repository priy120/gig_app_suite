name: Build All 3 Gig Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Build Customer App APK
      run: |
        cd apps/customer_app
        rm -rf android
        flutter create . --org com.kasba.customer --platforms=android
        sed -i 's/id "dev.flutter.flutter-gradle-plugin"/id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
        sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
        flutter pub get
        flutter build apk --release
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/customer-app-release.apk

    - name: Build Partner App APK
      run: |
        cd apps/partner_app
        rm -rf android
        flutter create . --org com.kasba.partner --platforms=android
        sed -i 's/id "dev.flutter.flutter-gradle-plugin"/id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
        sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
        flutter pub get
        flutter build apk --release
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/partner-app-release.apk

    - name: Build Admin App APK
      run: |
        cd apps/admin_app
        rm -rf android
        flutter create . --org com.kasba.admin --platforms=android
        sed -i 's/id "dev.flutter.flutter-gradle-plugin"/id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services" version "4.4.2" apply false/' android/settings.gradle
        sed -i 's/id "com.android.application"/id "com.android.application"\n    id "com.google.gms.google-services"/' android/app/build.gradle
        flutter pub get
        flutter build apk --release
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/admin-app-release.apk

    - name: Upload All APKs
      uses: actions/upload-artifact@v4
      with:
        name: all-gig-apps
        path: |
          apps/customer_app/build/app/outputs/flutter-apk/customer-app-release.apk
          apps/partner_app/build/app/outputs/flutter-apk/partner-app-release.apk
          apps/admin_app/build/app/outputs/flutter-apk/admin-app-release.apk
